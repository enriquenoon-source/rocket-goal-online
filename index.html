<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Soccer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            user-select: none;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
    <!-- Import Three.js and Cannon.js via ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "cannon-es": "https://unpkg.com"
            }
        }
    </script>
</head>
<body>

    <div id="ui">BLUE 0 - 0 ORANGE</div>
    <div id="controls">WASD / Arrows: Drive | Space: Handbrake/Stop | R: Reset Ball</div>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';

        // --- GAME STATE ---
        let scoreBlue = 0;
        let scoreOrange = 0;

        // --- SYSTEM SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // Camera
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- MATERIALS & PHYSICS SETUP ---
        const groundMaterial = new CANNON.Material('ground');
        const wheelMaterial = new CANNON.Material('wheel');
        const ballMaterial = new CANNON.Material('ball');

        const carGroundContact = new CANNON.ContactMaterial(groundMaterial, wheelMaterial, {
            friction: 0.5,
            restitution: 0.1
        });
        const ballGroundContact = new CANNON.ContactMaterial(groundMaterial, ballMaterial, {
            friction: 0.2,
            restitution: 0.8 // Bouncy ball
        });
        world.addContactMaterial(carGroundContact);
        world.addContactMaterial(ballGroundContact);

        // --- ENVIRONMENT (STADIUM) ---
        // Pitch
        const pitchGeo = new THREE.PlaneGeometry(60, 100);
        const pitchMat = new THREE.MeshStandardMaterial({ color: 0x224422, side: THREE.DoubleSide });
        const pitchMesh = new THREE.Mesh(pitchGeo, pitchMat);
        pitchMesh.rotation.x = -Math.PI / 2;
        pitchMesh.receiveShadow = true;
        scene.add(pitchMesh);

        const groundBody = new CANNON.Body({ mass: 0, material: groundMaterial });
        groundBody.addShape(new CANNON.Plane());
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(groundBody);

        // Borders/Walls
        function createWall(w, h, d, x, y, z) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: 0x333344, transparent: true, opacity: 0.3 }));
            mesh.position.set(x, y, z);
            scene.add(mesh);
            const body = new CANNON.Body({ mass: 0, material: groundMaterial });
            body.addShape(new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)));
            body.position.set(x, y, z);
            world.addBody(body);
        }
        // Side walls
        createWall(1, 20, 100, -30, 10, 0);
        createWall(1, 20, 100, 30, 10, 0);
        // Back walls (leaving gaps for goals would require split boxes, simplified here to solid boundary checking in loop)
        createWall(60, 20, 1, 0, 10, -50);
        createWall(60, 20, 1, 0, 10, 50);

        // Visual Goalposts
        const goalBlue = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 2), new THREE.MeshBasicMaterial({ color: 0x0000ff, wireframe: true }));
        goalBlue.position.set(0, 4, -49);
        scene.add(goalBlue);

        const goalOrange = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 2), new THREE.MeshBasicMaterial({ color: 0xffa500, wireframe: true }));
        goalOrange.position.set(0, 4, 49);
        scene.add(goalOrange);

        // --- SOCCER BALL ---
        const ballRadius = 2.5;
        const ballGeo = new THREE.SphereGeometry(ballRadius, 16, 16);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: false });
        const ballMesh = new THREE.Mesh(ballGeo, ballMat);
        ballMesh.castShadow = true;
        scene.add(ballMesh);

        const ballBody = new CANNON.Body({ mass: 5, material: ballMaterial });
        ballBody.addShape(new CANNON.Sphere(ballRadius));
        ballBody.position.set(0, 10, 0);
        ballBody.linearDamping = 0.1;
        ballBody.angularDamping = 0.1;
        world.addBody(ballBody);

        // --- PLAYER CAR ---
        const carWidth = 3, carHeight = 1.2, carLength = 5;
        const carGeo = new THREE.BoxGeometry(carWidth, carHeight, carLength);
        const carMat = new THREE.MeshStandardMaterial({ color: 0x00a8ff });
        const carMesh = new THREE.Mesh(carGeo, carMat);
        carMesh.castShadow = true;
        scene.add(carMesh);

        const carBody = new CANNON.Body({ mass: 150, material: wheelMaterial });
        carBody.addShape(new CANNON.Box(new CANNON.Vec3(carWidth/2, carHeight/2, carLength/2)));
        carBody.position.set(0, 2, 30);
        world.addBody(carBody);

        // --- CONTROLS INPUT ---
        const keys = { w: false, a: false, s: false, d: false, Space: false };
        window.addEventListener('keydown', (e) => {
            let k = e.key.toLowerCase();
            if (e.code === 'Space') k = 'Space';
            if (e.key === 'ArrowUp') k = 'w';
            if (e.key === 'ArrowDown') k = 's';
            if (e.key === 'ArrowLeft') k = 'a';
            if (e.key === 'ArrowRight') k = 'd';
            if (keys[k] !== undefined) keys[k] = true;
            if (k === 'r') resetBall();
        });
        window.addEventListener('keyup', (e) => {
            let k = e.key.toLowerCase();
            if (e.code === 'Space') k = 'Space';
            if (e.key === 'ArrowUp') k = 'w';
            if (e.key === 'ArrowDown') k = 's';
            if (e.key === 'ArrowLeft') k = 'a';
            if (e.key === 'ArrowRight') k = 'd';
            if (keys[k] !== undefined) keys[k] = false;
        });

        function resetBall() {
            ballBody.position.set(0, 10, 0);
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);
        }

        // --- ENGINE LOOP ---
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            world.step(1 / 60, delta, 3);

            // Car Physics Movement Logic
            const speed = 25;
            const turnSpeed = 2.5;

            // Get local forward vector
            const localForward = new THREE.Vector3(0, 0, -1);
            const carRotation = new THREE.Quaternion(carBody.quaternion.x, carBody.quaternion.y, carBody.quaternion.z, carBody.quaternion.w);
            localForward.applyQuaternion(carRotation);

            // Driving forces
            if (keys.w) {
                carBody.velocity.x += localForward.x * speed * delta;
                carBody.velocity.z += localForward.z * speed * delta;
            }
            if (keys.s) {
                carBody.velocity.x -= localForward.x * (speed * 0.6) * delta;
                carBody.velocity.z -= localForward.z * (speed * 0.6) * delta;
            }

            // Steering (only when moving)
            const currentSpeed = Math.sqrt(carBody.velocity.x**2 + carBody.velocity.z**2);
            if (currentSpeed > 0.5) {
                const directionFactor = keys.s && !keys.w ? -1 : 1;
                if (keys.a) carBody.angularVelocity.y = turnSpeed * directionFactor;
                else if (keys.d) carBody.angularVelocity.y = -turnSpeed * directionFactor;
                else carBody.angularVelocity.y *= 0.9; // Stop rotating when letting go
            }

            if (keys.Space) {
                carBody.velocity.x *= 0.95;
                carBody.velocity.z *= 0.95;
            }

            // Sync visual meshes with physics rigid bodies
            carMesh.position.copy(carBody.position);
            carMesh.quaternion.copy(carBody.quaternion);

            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            // --- GOAL DETECTION ---
            // Blue Goal Zone (z close to -50, width within posts)
            if (ballBody.position.z < -49 && Math.abs(ballBody.position.x) < 8) {
                scoreOrange++;
                updateUI();
                resetBall();
            }
            // Orange Goal Zone (z close to 50, width within posts)
            if (ballBody.position.z > 49 && Math.abs(ballBody.position.x) < 8) {
                scoreBlue++;
            updateUI();
resetBall();
}
// --- CAMERA FOLLOW (Third-Person Rocket League style) ---
const targetCamPos = new THREE.Vector3(0, 6, 14); // Offset behind car
targetCamPos.applyQuaternion(carRotation);
targetCamPos.add(carBody.position);
camera.position.lerp(targetCamPos, 0.1);
camera.lookAt(ballMesh.position.clone().add(new THREE.Vector3(0, 1, 0))); // Track the ball
renderer.render(scene, camera);
}
function updateUI() {
document.getElementById('ui').innerText = BLUE ${scoreBlue} - ${scoreOrange} ORANGE;
}
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
// Start loop
animate();
